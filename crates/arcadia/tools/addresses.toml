# Every game address the arcadia crate resolves, with its 13.0.4 value. tools/patterns.py turns
# this into src/offsets.rs. `name` is the accessor in `offsets::`, `kind` is how it is found:
#   fn        a function, matched on its own first bytes
#   adrp_ldr  a global reached with ADRP + LDR inside `anchor`
#   adrp_add  a global (vtable) reached with ADRP + ADD inside `anchor`

